version: '3'

services:
  graphtoy-plus:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphtoy-plus.rule=Host(`graphtoy-plus.csprance.com`)"
      - "traefik.http.routers.graphtoy-plus.entrypoints=websecure"
      - "traefik.http.routers.graphtoy-plus.tls.certresolver=myresolver"
      - "traefik.http.services.graphtoy-plus.loadBalancer.server.port=3000"
